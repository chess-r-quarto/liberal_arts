<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liberal Arts Launcher</title>
    <!-- Dependencies: Stable versions via CDN -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Base styles to prevent scrollbar pop-in and ensure smooth rendering */
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc; /* Tailwind slate-50 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Hide scrollbar for top navigation to keep it clean on mobile */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Custom scrollbar for webkit (main content) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Register custom Babel preset for TSX as per architectural requirements
      Babel.registerPreset('tsx', {
        presets: [
          [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
          Babel.availablePresets['react']
        ]
      });
    </script>

    <script type="text/babel" data-presets="tsx">
      /**
       * SVG Icon Components
       */
      const HomeIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      );

      const EnvIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <line x1="3" x2="21" y1="9" y2="9"></line>
          <line x1="9" x2="9" y1="21" y2="9"></line>
        </svg>
      );

      const BookIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
        </svg>
      );

      const MathIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500">
          <rect width="16" height="20" x="4" y="2" rx="2"></rect>
          <line x1="8" x2="16" y1="6" y2="6"></line>
          <line x1="16" x2="16" y1="14" y2="18"></line>
          <path d="M16 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 14h.01"></path>
          <path d="M8 14h.01"></path>
          <path d="M12 18h.01"></path>
          <path d="M8 18h.01"></path>
        </svg>
      );

      const ChartIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-green-600">
          <path d="M3 3v18h18"></path>
          <path d="m19 9-5 5-4-4-3 3"></path>
        </svg>
      );

      const ChartBarIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-teal-600">
          <path d="M3 3v18h18"></path>
          <rect width="4" height="7" x="7" y="14" rx="1"></rect>
          <rect width="4" height="12" x="15" y="9" rx="1"></rect>
        </svg>
      );

      /**
       * Type Definitions
       */
      interface AppCardProps {
        id: string;
        title: string;
        version: string;
        description: string;
        url: string;
        manualUrl: string;
        icon: React.ReactNode;
      }

      /**
       * Components
       */
      const AppCard: React.FC<AppCardProps> = ({ title, version, description, url, manualUrl, icon }) => {
        return (
          <div className="bg-white rounded-xl border border-gray-200 shadow-sm flex flex-col items-center p-6 sm:p-8 transition-shadow hover:shadow-md h-full">
            <div className="mb-5">
              {icon}
            </div>
            <h3 className="text-lg font-bold text-gray-800 text-center mb-1">{title}</h3>
            <span className="text-xs font-semibold text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full mb-4">
              {version}
            </span>
            <p className="text-sm text-gray-600 text-center flex-grow mb-6 line-clamp-3">
              {description}
            </p>
            <div className="w-full flex space-x-3 mt-auto">
              <a
                href={url}
                target="_blank"
                rel="noopener noreferrer"
                className="flex-1 bg-[#43b02a] hover:bg-[#389123] text-white font-medium py-3 px-4 rounded-lg text-center transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-[#43b02a] focus:ring-offset-2"
              >
                Launch
              </a>
              <a 
                href={manualUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="p-3 border border-gray-300 rounded-lg hover:bg-blue-50 text-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-300"
                title="Manual"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                </svg>
              </a>
            </div>
          </div>
        );
      };

      const TopNavigation: React.FC = () => {
        return (
          <div className="bg-[#1e293b] text-gray-300 w-full flex flex-col md:flex-row md:items-center justify-between border-b border-gray-700 sticky top-0 z-10 shadow-md">
            <div className="flex items-center p-4">
              <div className="w-8 h-8 rounded-full bg-[#43b02a] flex items-center justify-center text-white font-bold mr-3 shrink-0">
                L
              </div>
              <h1 className="text-xl font-bold text-white tracking-wide">Navigator</h1>
            </div>
            
            <nav className="overflow-x-auto no-scrollbar w-full md:w-auto">
              <ul className="flex space-x-1 px-2 pb-0 md:px-6">
                <li>
                  <a href="#" className="flex items-center px-4 py-3 bg-[#0f172a] rounded-t-md border-b-2 border-[#43b02a] text-white whitespace-nowrap">
                    <HomeIcon />
                    <span className="ml-2 font-medium">Home</span>
                  </a>
                </li>
                <li>
                  <a href="#" className="flex items-center px-4 py-3 hover:bg-[#334155] rounded-t-md border-b-2 border-transparent transition-colors whitespace-nowrap">
                    <EnvIcon />
                    <span className="ml-2 font-medium">Environments</span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        );
      };

      const App = () => {
        // Updated App Definitions with GitHub Pages links
        const applications: AppCardProps[] = [
          {
            id: 'logic',
            title: 'Logic Basic',
            version: '1.0.0',
            description: '論理学の基礎を学ぶためのモジュールです。命題論理や述語論理の基本概念を確認できます。',
            url: 'https://chess-r-quarto.github.io/liberal_arts/logic_basic.html',
            manualUrl: 'https://chess-r-quarto.github.io/liberal_arts/docs/logic_basic_manual.html',
            icon: <BookIcon />
          },
          {
            id: 'logic_term',
            title: 'Logic Terminology',
            version: '1.0.0',
            description: '論理学・集合論の重要用語を学ぶための学習ノートです。200の用語をカテゴリ別に解説しています。',
            url: 'https://chess-r-quarto.github.io/liberal_arts/logic_term.html',
            manualUrl: 'https://chess-r-quarto.github.io/liberal_arts/docs/logic_term_manual.html',
            icon: <BookIcon />
          },
          {
            id: 'math',
            title: 'Math Terminology',
            version: '1.0.0',
            description: '数学用語の解説とリファレンス。代数、解析、幾何などの基礎的な用語を網羅しています。',
            url: 'https://chess-r-quarto.github.io/liberal_arts/math_term.html',
            manualUrl: 'https://chess-r-quarto.github.io/liberal_arts/docs/math_term_manual.html',
            icon: <MathIcon />
          },
          {
            id: 'stat1',
            title: 'Stat Terminology 1',
            version: '1.0.0',
            description: '統計学の基礎用語集パート1。記述統計学や確率の基礎に関する概念を学びます。',
            url: 'https://chess-r-quarto.github.io/liberal_arts/stat_term.html',
            manualUrl: 'https://chess-r-quarto.github.io/liberal_arts/docs/stat_term_manual.html',
            icon: <ChartIcon />
          },
          {
            id: 'stat2',
            title: 'Stat Terminology 2',
            version: '1.0.0',
            description: '統計学の基礎用語集パート2。推測統計学、検定、回帰分析などの用語を解説します。',
            url: 'https://chess-r-quarto.github.io/liberal_arts/stat_term2.html',
            manualUrl: 'https://chess-r-quarto.github.io/liberal_arts/docs/stat_term2_manual.html',
            icon: <ChartBarIcon />
          }
        ];

        return (
          <div className="flex flex-col min-h-screen bg-slate-50 font-sans">
            <TopNavigation />
            
            {/* Header controls */}
            <header className="bg-white border-b border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between p-4 sm:px-8 shadow-sm gap-4">
              <div className="flex items-center w-full sm:w-auto">
                <span className="text-gray-500 mr-3 text-sm whitespace-nowrap">Environment:</span>
                <select className="flex-1 sm:flex-none border border-gray-300 rounded-md px-3 py-2 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-[#43b02a] focus:border-transparent">
                  <option>liberal_arts (base)</option>
                </select>
              </div>
              <div className="flex items-center justify-end space-x-4">
                <button className="text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors">
                  Documentation
                </button>
                <div className="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 border border-gray-300 cursor-pointer hover:bg-gray-200 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
              </div>
            </header>

            {/* Main Content */}
            <main className="flex-1 p-4 sm:p-8 max-w-7xl mx-auto w-full">
              <div className="mb-6 sm:mb-8">
                <h2 className="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">
                  Applications on <span className="text-[#43b02a]">liberal_arts</span>
                </h2>
                <p className="text-gray-600 mt-2 text-sm sm:text-base">
                  Select an educational module to launch from the repository.
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                {applications.map((app) => (
                  <AppCard key={app.id} {...app} />
                ))}
              </div>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
