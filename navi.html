<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liberal Arts Launcher</title>
    <!-- Dependencies: Stable versions via CDN -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Base styles to prevent scrollbar pop-in and ensure smooth rendering */
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f4f6; /* Tailwind slate-50 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Register custom Babel preset for TSX as per architectural requirements
      Babel.registerPreset('tsx', {
        presets: [
          [Babel.availablePresets['typescript'], { isTSX: true, allExtensions: true }],
          Babel.availablePresets['react']
        ]
      });
    </script>

    <script type="text/babel" data-presets="tsx">
      /**
       * SVG Icon Components
       */
      const HomeIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      );

      const EnvIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <line x1="3" x2="21" y1="9" y2="9"></line>
          <line x1="9" x2="9" y1="21" y2="9"></line>
        </svg>
      );

      const BookIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
        </svg>
      );

      const MathIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500">
          <rect width="16" height="20" x="4" y="2" rx="2"></rect>
          <line x1="8" x2="16" y1="6" y2="6"></line>
          <line x1="16" x2="16" y1="14" y2="18"></line>
          <path d="M16 10h.01"></path>
          <path d="M12 10h.01"></path>
          <path d="M8 10h.01"></path>
          <path d="M12 14h.01"></path>
          <path d="M8 14h.01"></path>
          <path d="M12 18h.01"></path>
          <path d="M8 18h.01"></path>
        </svg>
      );

      const ChartIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-green-600">
          <path d="M3 3v18h18"></path>
          <path d="m19 9-5 5-4-4-3 3"></path>
        </svg>
      );

      const ChartBarIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className="text-teal-600">
          <path d="M3 3v18h18"></path>
          <rect width="4" height="7" x="7" y="14" rx="1"></rect>
          <rect width="4" height="12" x="15" y="9" rx="1"></rect>
        </svg>
      );

      /**
       * Type Definitions
       */
      interface AppCardProps {
        id: string;
        title: string;
        version: string;
        description: string;
        fileName: string;
        icon: React.ReactNode;
      }

      /**
       * Components
       */
      const AppCard: React.FC<AppCardProps> = ({ title, version, description, fileName, icon }) => {
        return (
          <div className="bg-white rounded-lg border border-gray-200 shadow-sm flex flex-col items-center p-6 transition-shadow hover:shadow-md h-full">
            <div className="mb-4">
              {icon}
            </div>
            <h3 className="text-lg font-bold text-gray-800 text-center mb-1">{title}</h3>
            <span className="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded-full mb-3">
              {version}
            </span>
            <p className="text-sm text-gray-600 text-center flex-grow mb-6 line-clamp-3">
              {description}
            </p>
            <div className="w-full flex space-x-2 mt-auto">
              <a
                href={fileName}
                target="_blank"
                rel="noopener noreferrer"
                className="flex-1 bg-[#43b02a] hover:bg-[#389123] text-white font-medium py-2 px-4 rounded text-center transition-colors shadow-sm"
              >
                Launch
              </a>
              <button 
                className="p-2 border border-gray-300 rounded hover:bg-gray-50 text-gray-600 transition-colors"
                title="Settings"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
        );
      };

      const Sidebar: React.FC = () => {
        return (
          <div className="w-64 bg-[#1e293b] text-gray-300 flex flex-col h-screen fixed left-0 top-0">
            <div className="flex items-center p-6 mb-2 border-b border-gray-700">
              <div className="w-8 h-8 rounded-full bg-[#43b02a] flex items-center justify-center text-white font-bold mr-3">
                L
              </div>
              <h1 className="text-xl font-bold text-white tracking-wide">Navigator</h1>
            </div>
            
            <nav className="flex-1">
              <ul className="space-y-1">
                <li>
                  <a href="#" className="flex items-center px-6 py-3 bg-[#0f172a] border-l-4 border-[#43b02a] text-white">
                    <HomeIcon />
                    <span className="ml-3 font-medium">Home</span>
                  </a>
                </li>
                <li>
                  <a href="#" className="flex items-center px-6 py-3 hover:bg-[#334155] border-l-4 border-transparent transition-colors">
                    <EnvIcon />
                    <span className="ml-3 font-medium">Environments</span>
                  </a>
                </li>
              </ul>
            </nav>

            <div className="p-6 border-t border-gray-700 text-xs text-gray-500">
              <p>chess-r-quarto</p>
              <p className="mt-1">liberal_arts repository</p>
            </div>
          </div>
        );
      };

      const App = () => {
        // App Definitions based on repository files
        const applications: AppCardProps[] = [
          {
            id: 'logic',
            title: 'Logic Basic',
            version: '1.0.0',
            description: '論理学の基礎を学ぶためのモジュールです。命題論理や述語論理の基本概念を確認できます。',
            fileName: 'logic_basic.html',
            icon: <BookIcon />
          },
          {
            id: 'math',
            title: 'Math Terminology',
            version: '1.0.0',
            description: '数学用語の解説とリファレンス。代数、解析、幾何などの基礎的な用語を網羅しています。',
            fileName: 'math_term.html',
            icon: <MathIcon />
          },
          {
            id: 'stat1',
            title: 'Stat Terminology 1',
            version: '1.0.0',
            description: '統計学の基礎用語集パート1。記述統計学や確率の基礎に関する概念を学びます。',
            fileName: 'stat_term.html',
            icon: <ChartIcon />
          },
          {
            id: 'stat2',
            title: 'Stat Terminology 2',
            version: '1.0.0',
            description: '統計学の基礎用語集パート2。推測統計学、検定、回帰分析などの用語を解説します。',
            fileName: 'stat_term2.html',
            icon: <ChartBarIcon />
          }
        ];

        return (
          <div className="flex min-h-screen bg-slate-50 font-sans">
            <Sidebar />
            
            <div className="flex-1 ml-64 flex flex-col">
              {/* Header */}
              <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
                <div className="flex items-center">
                  <span className="text-gray-500 mr-2">Environment:</span>
                  <select className="border border-gray-300 rounded px-3 py-1 bg-gray-50 text-sm focus:outline-none focus:ring-1 focus:ring-[#43b02a]">
                    <option>liberal_arts (base)</option>
                  </select>
                </div>
                <div className="flex items-center space-x-4">
                  <button className="text-gray-500 hover:text-gray-700 text-sm font-medium">
                    Documentation
                  </button>
                  <div className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 border border-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </div>
                </div>
              </header>

              {/* Main Content */}
              <main className="flex-1 p-8">
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-gray-800">Applications on <span className="text-[#43b02a]">liberal_arts</span></h2>
                  <p className="text-gray-600 mt-1">Select an application to launch from your repository.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {applications.map((app) => (
                    <AppCard key={app.id} {...app} />
                  ))}
                </div>
              </main>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
