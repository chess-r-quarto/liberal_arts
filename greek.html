<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギリシャ文字の書き順 & 数学・統計学活用ガイド</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }

    /* アニメーション用ストロークスタイル */
    .stroke-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      transition: stroke-dashoffset 0.1s linear;
    }

    @keyframes strokeDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    .animate-draw {
      animation: strokeDraw 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>
<body class="h-full flex flex-col md:flex-row overflow-hidden bg-slate-950 text-slate-100">

  <!-- 画面左側: ギリシャ文字選択リスト ＆ フィルター -->
  <aside class="w-full md:w-80 lg:w-96 bg-slate-900/90 border-r border-slate-800 flex flex-col h-auto md:h-full z-10 shadow-xl">
    <!-- ヘッダー -->
    <div class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur">
      <div class="flex items-center space-x-3 mb-3">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
          <i class="fa-solid font-bold text-xl">αβ</i>
        </div>
        <div>
          <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-sky-300 to-emerald-400">
            ギリシャ文字書き順ガイド
          </h1>
          <p class="text-xs text-slate-400">数学・統計学の記号と書き順マスター</p>
        </div>
      </div>

      <!-- 検索・フィルター -->
      <div class="space-y-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="文字名、読み、記号で検索 (例: alpha, 偏差)..." 
            class="w-full bg-slate-950 text-sm text-slate-200 placeholder-slate-500 pl-9 pr-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        
        <div class="flex gap-1 text-xs p-1 bg-slate-950/80 rounded-lg border border-slate-800/80">
          <button id="filterAll" class="filter-btn active flex-1 py-1 px-2 rounded-md font-medium text-center transition-all bg-indigo-600 text-white shadow">すべて</button>
          <button id="filterLower" class="filter-btn flex-1 py-1 px-2 rounded-md font-medium text-center text-slate-400 hover:text-slate-200 transition-all">小文字</button>
          <button id="filterUpper" class="filter-btn flex-1 py-1 px-2 rounded-md font-medium text-center text-slate-400 hover:text-slate-200 transition-all">大文字</button>
        </div>
      </div>
    </div>

    <!-- 文字リスト (スクロール領域) -->
    <div id="greekList" class="flex-1 overflow-y-auto p-3 space-y-2">
      <!-- JavaScriptでリスト要素を動的生成 -->
    </div>
  </aside>

  <!-- 画面右側: 詳細・書き順表示メイン領域 -->

    <!-- メインコンテンツ領域 -->
    <div class="relative z-10 p-4 md:p-8 max-w-5xl mx-auto w-full space-y-6 flex-1 flex flex-col justify-between">
      
      <div>
        <!-- ヘッダーカード (選択中文字) -->
        <div id="charHeaderCard" class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-md shadow-2xl flex flex-col sm:flex-row items-center sm:items-start justify-between gap-6">
          <div class="flex items-center space-x-6">
            <div id="mainSymbolDisplay" class="w-24 h-24 rounded-2xl bg-gradient-to-br from-indigo-950 to-slate-900 border border-indigo-500/30 flex items-center justify-center text-6xl font-serif text-indigo-300 shadow-inner">
              α
            </div>
            <div>
              <div class="flex items-center space-x-3">
                <h2 id="mainEnglishName" class="text-3xl font-bold tracking-tight text-white">Alpha</h2>

              </div>
              <p id="mainJapaneseReading" class="text-lg text-slate-300 mt-1">アルファ</p>
              <p id="mainGreekSpelling" class="text-xs text-slate-500 font-mono mt-0.5">ギリシャ語: άλφα</p>
            </div>
          </div>

              <span id="pairToggleText">大文字 (Α) を見る</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>
        </div>

        <!-- メイングリッド: 書き順キャンバス ＆ 数学・統計での使用例 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-6">
          
          <!-- 左側: 書き順インタラクティブ表示 (7カラム) -->
          <div class="lg:col-span-7 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-md shadow-xl flex flex-col items-center justify-between">
            <div class="w-full flex justify-between items-center mb-4">

                <span id="strokeCountBadge" class="bg-slate-800 px-2 py-1 rounded text-slate-300 font-mono">1 画</span>
              </div>
            </div>

              <svg class="absolute inset-0 w-full h-full stroke-slate-800/50 stroke-1 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                <line x1="50%" y1="0" x2="50%" y2="100%" stroke-dasharray="4" />
                <line x1="0" y1="50%" x2="100%" y2="50%" stroke-dasharray="4" />
                <rect x="10%" y="10%" width="80%" height="80%" fill="none" stroke-dasharray="2" class="opacity-30" />

              </svg>

            </div>

            <!-- 操作コントロール -->

                <button id="btnStepNext" class="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-medium text-sm rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-2" title="1画ずつ進む">

                </button>

                </button>
              </div>

                <span>速度:</span>
                <div class="flex items-center gap-2 w-2/3">
                  <span class="text-[10px]">遅い</span>

            </div>
          </div>

              </div>

                <!-- 動的表示 -->

        </div>

        <p class="text-slate-600">※使用分野や文献によって表記ルールが一部異なる場合があります。</p>

    </div>

      },

        stat: "・標本空間（全事象の集合 Ω の要素 ω ∈ Ω）",
        tip: "アルファベットの「w」を丸く丸めた形です。左のコップから右のコップへ繋げるイメージで描きます。"
      },
      {
        id: 'omega-upper',
        symbol: 'Ω',
        name: 'Omega (大文字)',
        reading: 'オメガ (大文字)',
        greekSpelling: 'Ωμέγα',
        isUpper: true,
        pairId: 'omega-lower',
        strokes: [
          "M 40 160 L 70 160 C 60 80, 140 80, 130 160 L 160 160"
        ],
        math: "・電気抵抗の単位 オーム (Ω)<br>・計算量のオーダー（ビッグオメガ記法）",
        stat: "・全事象・全事象集合（全確率 1 の全体集合 Ω）",
        tip: "左の台座から始まり、大きな馬蹄（アーチ）を描いて右の台座に着地します。"
      }
    ];

    // アプリケーション状態変数
    let currentData = GREEK_DATA[0];
    let filterMode = 'all'; // 'all', 'lower', 'upper'
    let searchQuery = '';
    let isAnimating = false;
    let animationTimer = null;
    let currentStep = 0;
    let playbackSpeed = 1.0;

    // DOM要素参照
    const greekListEl = document.getElementById('greekList');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    
    // 詳細エリアDOM
    const mainSymbolDisplay = document.getElementById('mainSymbolDisplay');
    const mainEnglishName = document.getElementById('mainEnglishName');
    const mainJapaneseReading = document.getElementById('mainJapaneseReading');
    const mainGreekSpelling = document.getElementById('mainGreekSpelling');
    const mainCaseBadge = document.getElementById('mainCaseBadge');
    const pairToggleBtn = document.getElementById('pairToggleBtn');
    const pairToggleText = document.getElementById('pairToggleText');
    
    const strokeSvg = document.getElementById('strokeSvg');
    const strokeCountBadge = document.getElementById('strokeCountBadge');
    const mathMeaningBox = document.getElementById('mathMeaningBox');
    const statMeaningBox = document.getElementById('statMeaningBox');
    const tipBox = document.getElementById('tipBox');
    const playingGuide = document.getElementById('playingGuide');

    // コントロールボタン
    const btnPlayAnimation = document.getElementById('btnPlayAnimation');
    const btnStepNext = document.getElementById('btnStepNext');
    const btnResetCanvas = document.getElementById('btnResetCanvas');
    const speedSlider = document.getElementById('speedSlider');

    /**
     * リストの更新描画
     */
    function renderList() {
      greekListEl.innerHTML = '';

      const filtered = GREEK_DATA.filter(item => {
        // フィルターチェック
        if (filterMode === 'lower' && item.isUpper) return false;
        if (filterMode === 'upper' && !item.isUpper) return false;

        // 検索クエリチェック
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = item.name.toLowerCase().includes(q);
          const matchReading = item.reading.includes(q);
          const matchSymbol = item.symbol.includes(q);
          const matchMath = item.math.toLowerCase().includes(q);
          const matchStat = item.stat.toLowerCase().includes(q);
          return matchName || matchReading || matchSymbol || matchMath || matchStat;
        }
        return true;
      });

      if (filtered.length === 0) {
        greekListEl.innerHTML = `
          <div class="text-center py-8 text-slate-500 text-xs">
            <i class="fa-solid fa-folder-open text-2xl mb-2"></i><br>
            一致するギリシャ文字が見つかりません
          </div>`;
        return;
      }

      filtered.forEach(item => {
        const isActive = item.id === currentData.id;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border transition-all cursor-pointer flex items-center justify-between group ${
          isActive 
            ? 'bg-indigo-950/60 border-indigo-500/80 text-white shadow-lg shadow-indigo-950/50' 
            : 'bg-slate-950/50 border-slate-800/80 hover:border-slate-700 hover:bg-slate-900/60 text-slate-300'
        }`;

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-lg ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-indigo-400 group-hover:bg-slate-800'} flex items-center justify-center font-serif text-2xl font-bold border border-indigo-500/20">
              ${item.symbol}
            </div>
            <div>
              <div class="font-bold text-sm leading-none flex items-center gap-1.5">
                <span>${item.name}</span>
                <span class="text-[10px] px-1.5 py-0.2 rounded ${item.isUpper ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-indigo-500/20 text-indigo-300'}">
                  ${item.isUpper ? '大' : '小'}
                </span>
              </div>
              <div class="text-xs text-slate-400 mt-1">${item.reading}</div>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs ${isActive ? 'text-indigo-400' : 'text-slate-600 group-hover:text-slate-400'}"></i>
        `;

        card.addEventListener('click', () => {
          selectCharacter(item);
        });

        greekListEl.appendChild(card);
      });
    }

    /**
     * 文字詳細の選択＆表示更新
     */
    function selectCharacter(item) {
      currentData = item;
      stopAnimation();
      
      // UIヘッダーの更新
      mainSymbolDisplay.textContent = item.symbol;
      mainEnglishName.textContent = item.name;
      mainJapaneseReading.textContent = item.reading;
      mainGreekSpelling.textContent = `ギリシャ語: ${item.greekSpelling}`;
      mainCaseBadge.textContent = item.isUpper ? '大文字' : '小文字';
      mainCaseBadge.className = `text-xs px-2.5 py-0.5 rounded-full font-semibold ${
        item.isUpper ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'
      }`;

      // ペア切替ボタン
      const pairItem = GREEK_DATA.find(p => p.id === item.pairId);
      if (pairItem) {
        pairToggleBtn.style.display = 'flex';
        pairToggleText.textContent = `${pairItem.isUpper ? '大文字' : '小文字'} (${pairItem.symbol}) を見る`;
        pairToggleBtn.onclick = () => selectCharacter(pairItem);
      } else {
        pairToggleBtn.style.display = 'none';
      }

      // 解説・意味の更新
      strokeCountBadge.textContent = `${item.strokes.length} 画`;
      mathMeaningBox.innerHTML = item.math;
      statMeaningBox.innerHTML = item.stat;
      tipBox.textContent = item.tip;

      // リスト再描画 (アクティブ強調のため)
      renderList();

      // SVG描画の初期化
      resetSvgCanvas();
      playStrokeAnimation();
    }

    /**
     * SVGキャンバスをデータに基づいて再構築
     */
    function resetSvgCanvas() {
      stopAnimation();
      currentStep = 0;
      strokeSvg.innerHTML = '';

      // 画数ガイド用パスとストロークの描画
      currentData.strokes.forEach((d, idx) => {
        // 背景のガイド薄線（書き順の全体構造）
        const bgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        bgPath.setAttribute('d', d);
        bgPath.setAttribute('fill', 'none');
        bgPath.setAttribute('stroke', '#334155'); // slate-700
        bgPath.setAttribute('stroke-width', '12');
        bgPath.setAttribute('stroke-linecap', 'round');
        bgPath.setAttribute('stroke-linejoin', 'round');
        strokeSvg.appendChild(bgPath);

        // アニメーション用実線パス
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#818cf8'); // indigo-400
        path.setAttribute('stroke-width', '10');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.classList.add('stroke-path');
        path.id = `stroke-path-${idx}`;
        strokeSvg.appendChild(path);

        // 書き始めの番号バッジ（数字マーカー）
        const firstPoint = getFirstPointFromPath(d);
        if (firstPoint) {
          const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          group.setAttribute('id', `marker-${idx}`);
          group.style.opacity = '1';

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', firstPoint.x);
          circle.setAttribute('cy', firstPoint.y);
          circle.setAttribute('r', '11');
          circle.setAttribute('fill', '#6366f1'); // indigo-500
          circle.setAttribute('stroke', '#ffffff');
          circle.setAttribute('stroke-width', '2');

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', firstPoint.x);
          text.setAttribute('y', firstPoint.y + 4);
          text.setAttribute('fill', '#ffffff');
          text.setAttribute('font-size', '11');
          text.setAttribute('font-weight', 'bold');
          text.setAttribute('text-anchor', 'middle');
          text.textContent = (idx + 1).toString();

          group.appendChild(circle);
          group.appendChild(text);
          strokeSvg.appendChild(group);
        }
      });
    }

    /**
     * パス文字列 M x y からスタート座標を抽出
     */
    function getFirstPointFromPath(d) {
      const match = d.match(/M\s*([\d.-]+)\s+([\d.-]+)/i);
      if (match) {
        return { x: parseFloat(match[1]), y: parseFloat(match[2]) };
      }
      return { x: 100, y: 100 };
    }

    /**
     * 書き順全自動アニメーションの再生
     */
    function playStrokeAnimation() {
      resetSvgCanvas();
      isAnimating = true;
      playingGuide.style.opacity = '1';

      const paths = strokeSvg.querySelectorAll('.stroke-path');
      let strokeIndex = 0;

      function animateNextStroke() {
        if (strokeIndex >= paths.length) {
          isAnimating = false;
          playingGuide.style.opacity = '0';
          return;
        }

        const path = paths[strokeIndex];
        const length = path.getTotalLength();
        
        // アニメーション設定
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
        
        // 速度に応じたアニメーション時間計算
        const duration = (1.0 / playbackSpeed) * 0.8;
        path.style.transition = `stroke-dashoffset ${duration}s cubic-bezier(0.4, 0, 0.2, 1)`;

        // 描画開始
        requestAnimationFrame(() => {
          path.style.strokeDashoffset = '0';
        });

        strokeIndex++;
        animationTimer = setTimeout(animateNextStroke, duration * 1000 + 150);
      }

      animateNextStroke();
    }

    /**
     * 1画ずつ手動で進める
     */
    function stepNextStroke() {
      if (isAnimating) stopAnimation();

      const paths = strokeSvg.querySelectorAll('.stroke-path');
      if (currentStep >= paths.length) {
        // すべて描画済みの場合は最初に戻す
        resetSvgCanvas();
        currentStep = 0;
      }

      const path = paths[currentStep];
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      
      requestAnimationFrame(() => {
        path.style.transition = 'stroke-dashoffset 0.4s ease-out';
        path.style.strokeDashoffset = '0';
      });

      currentStep++;
    }

    /**
     * アニメーションの停止
     */
    function stopAnimation() {
      isAnimating = false;
      if (animationTimer) clearTimeout(animationTimer);
      playingGuide.style.opacity = '0';
    }

    // イベントリスナーの登録
    function setupEventListeners() {
      // 検索入力
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderList();
      });

      // フィルターボタン
      filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterBtns.forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white', 'shadow');
            b.classList.add('text-slate-400');
          });
          e.target.classList.add('bg-indigo-600', 'text-white', 'shadow');
          e.target.classList.remove('text-slate-400');

          if (e.target.id === 'filterAll') filterMode = 'all';
          if (e.target.id === 'filterLower') filterMode = 'lower';
          if (e.target.id === 'filterUpper') filterMode = 'upper';

          renderList();
        });
      });

      // アニメーション制御ボタン
      btnPlayAnimation.addEventListener('click', playStrokeAnimation);
      btnStepNext.addEventListener('click', stepNextStroke);
      btnResetCanvas.addEventListener('click', resetSvgCanvas);

      // 速度スライダー
      speedSlider.addEventListener('input', (e) => {
        playbackSpeed = parseFloat(e.target.value);
      });
    }

    // 初期化実行
    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      renderList();
      selectCharacter(GREEK_DATA[0]);
    });
  </script>
